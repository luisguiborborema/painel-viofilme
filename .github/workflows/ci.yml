name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um build por ref; cancela execuções antigas do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Sem segredos: o app cai no modo mock (isSupabaseConfigured() = false).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, não 20: os testes são .ts rodados direto por `node --test`,
          # que só existe sem flag a partir do 23, e o glob de arquivos do
          # runner chegou no 22. No 20 o passo falhava com "Could not find
          # tests/**/*.test.ts" — parecia teste quebrado e era versão.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Gates que bloqueiam.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Os testes só rodavam na mão de quem estava mexendo — 500 casos em 24
      # arquivos, cobrindo margem de pacote, conciliação bancária, score de
      # lead, escopo de squad e agenda. Regra quebrada por um refactor passava
      # pelo CI inteiro sem ninguém notar.
      - name: Testes
        run: npm test
